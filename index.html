<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sensor Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f3f6fa;color:#333}header{background:#1976d2;color:white;padding:18px}main{max-width:1100px;width:94%;margin:24px auto}.card{background:white;padding:22px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 8px #0001}h2{color:#1976d2;margin-top:0}label{display:block;margin:12px 0 5px;font-weight:bold}input{width:100%;padding:11px;border:1px solid #ccc;border-radius:6px;font-size:16px}button{margin-top:15px;padding:11px 20px;border:0;border-radius:6px;background:#1976d2;color:white;cursor:pointer}.hidden{display:none!important}.auth{max-width:450px;margin:7vh auto}.msg{white-space:pre-wrap;font-weight:bold;margin-top:12px}.error{color:#c5221f}.success{color:#188038}.hp{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;color:white;text-align:center;border-radius:9px}.blue{background:#2196f3}.red{background:#f44336}.green{background:#4caf50}.num{font-size:28px;font-weight:bold;margin-top:5px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:center}th{background:#1976d2;color:white}.danger{background:#ffcccc;color:#b00020;font-weight:bold}.pagination{text-align:center}.pagination button{margin:3px;padding:7px 12px}.active{background:#333}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar button{margin:0}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}}
</style></head><body><header><h1>🌡️ Sensor Dashboard</h1><div id="headerUser">กรุณาเข้าสู่ระบบ</div></header>
<section id="loginView" class="card auth"><h2>🔐 Login</h2><form onsubmit="event.preventDefault();login()"><label>ชื่อผู้ใช้</label><input id="username" autocomplete="username" required maxlength="80"><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" required maxlength="200"><div class="hp" aria-hidden="true"><label>อย่ากรอกช่องนี้</label><input id="loginWebsite" tabindex="-1" autocomplete="off"></div><button id="loginBtn">เข้าสู่ระบบ</button><div id="loginMsg" class="msg"></div></form></section>
<main id="dashboard" class="hidden"><section class="card"><div class="bar"><h2>📝 กรอกข้อมูล Sensor</h2><button onclick="logout()">ออกจากระบบ</button></div><form onsubmit="event.preventDefault();saveData()"><div class="grid"><div><label>อุณหภูมิ (°C)</label><input id="temperature" type="number" step=".1" min="-50" max="100" required></div><div><label>ความชื้น (%)</label><input id="humidity" type="number" step=".1" min="0" max="100" required></div></div><div class="hp" aria-hidden="true"><label>Website</label><input id="sensorWebsite" tabindex="-1" autocomplete="off"></div><button id="saveBtn">💾 บันทึกข้อมูล</button></form><div id="msg" class="msg"></div></section>
<section class="card"><h2>📊 Dashboard</h2><div class="stats"><div class="stat blue">จำนวนข้อมูล<div class="num" id="total">0</div></div><div class="stat red">อุณหภูมิสูงสุด<div class="num" id="max">0°C</div></div><div class="stat green">ค่าอุณหภูมิกำหนด<div class="num" id="limit">35°C</div></div></div><canvas id="chart"></canvas></section>
<section class="card"><h2>📋 ข้อมูล Sensor</h2><div class="tablewrap"><table><thead><tr><th>วันที่</th><th>เวลา</th><th>อุณหภูมิ</th><th>ความชื้น</th><th>ผู้บันทึก</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pages" class="pagination"></div></section></main>
<script>
const GAS_URL="https://script.google.com/macros/s/AKfycby0ELtzstsAl5E9bZtwXWXdbx0gYnkgN-7dA5J0XN-pIYAShxA3ZPU9blqd0JIM1JxF1g/exec";
let token="",username="",data=[],page=1,limit=35,chart=null;const perPage=5;
function api(p){return new Promise((resolve,reject)=>{if(GAS_URL.includes("PASTE_YOUR_"))return reject(Error("ยังไม่ได้ตั้งค่า GAS_URL ใน index.html"));let cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6),s=document.createElement("script"),done=false;let timer=setTimeout(()=>{clean();reject(Error("หมดเวลารอ API ตรวจสอบ URL /exec และการ Deploy"))},20000);function clean(){if(done)return;done=true;delete window[cb];s.remove();clearTimeout(timer)}window[cb]=r=>{clean();r&&r.ok?resolve(r):reject(Error(r?.message||"API error"))};s.onerror=()=>{clean();reject(Error("เรียก Apps Script ไม่สำเร็จ"))};s.src=GAS_URL+(GAS_URL.includes("?")?"&":"?")+new URLSearchParams({...p,callback:cb});document.body.appendChild(s)})}
function message(id,t,c=""){let e=document.getElementById(id);e.textContent=t;e.className="msg "+c}
async function login(){let b=document.getElementById("loginBtn");b.disabled=true;message("loginMsg","กำลังตรวจสอบ...");try{let r=await api({action:"login",username:document.getElementById("username").value.trim(),password:document.getElementById("password").value,website:document.getElementById("loginWebsite").value});token=r.token;username=r.username;document.getElementById("password").value="";document.getElementById("loginView").classList.add("hidden");document.getElementById("dashboard").classList.remove("hidden");document.getElementById("headerUser").textContent="👤 Login: "+username;await load()}catch(e){message("loginMsg","❌ "+e.message,"error")}finally{b.disabled=false}}
function logout(){token="";data=[];if(chart){chart.destroy();chart=null}document.getElementById("dashboard").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden");document.getElementById("headerUser").textContent="กรุณาเข้าสู่ระบบ";document.getElementById("username").value="";document.getElementById("password").value="";message("loginMsg","ออกจากระบบแล้ว","success")}
async function load(){try{let [a,b]=await Promise.all([api({action:"list",token}),api({action:"limit",token})]);data=a.data||[];limit=Number(b.limit)||35;document.getElementById("limit").textContent=limit+"°C";page=1;render();draw()}catch(e){message("msg","โหลดข้อมูลไม่สำเร็จ: "+e.message,"error")}}
async function saveData(){let t=document.getElementById("temperature").value,h=document.getElementById("humidity").value,w=document.getElementById("sensorWebsite").value;if(t===""||h==="")return message("msg","กรุณากรอกข้อมูลให้ครบ","error");let b=document.getElementById("saveBtn");b.disabled=true;try{let r=await api({action:"save",token,temperature:t,humidity:h,website:w});message("msg","✅ "+r.message,"success");document.getElementById("temperature").value="";document.getElementById("humidity").value="";await load()}catch(e){message("msg","❌ "+e.message,"error")}finally{b.disabled=false}}
function render(){document.getElementById("total").textContent=data.length;let ts=data.map(x=>Number(x.temperature)).filter(Number.isFinite);document.getElementById("max").textContent=(ts.length?Math.max(...ts):0)+"°C";let body=document.getElementById("rows");body.replaceChildren();let items=data.slice((page-1)*perPage,page*perPage);if(!items.length){body.innerHTML='<tr><td colspan="5">ยังไม่มีข้อมูล</td></tr>'}items.forEach(r=>{let tr=document.createElement("tr");[r.date,r.time,r.temperature+" °C",r.humidity+" %",r.user].forEach((v,i)=>{let td=document.createElement("td");td.textContent=v??"";if(i===2&&Number(r.temperature)>limit)td.className="danger";tr.appendChild(td)});body.appendChild(tr)});let p=document.getElementById("pages");p.replaceChildren();for(let i=1;i<=Math.ceil(data.length/perPage);i++){let b=document.createElement("button");b.textContent=i;if(i===page)b.className="active";b.onclick=()=>{page=i;render()};p.appendChild(b)}}
function draw(){if(chart)chart.destroy();let d=data.slice().reverse();chart=new Chart(document.getElementById("chart"),{type:"line",data:{labels:d.map(x=>x.time||x.date),datasets:[{label:"Temperature (°C)",data:d.map(x=>Number(x.temperature)),borderColor:"red",tension:.3},{label:"Humidity (%)",data:d.map(x=>Number(x.humidity)),borderColor:"blue",tension:.3}]},options:{responsive:true,scales:{y:{beginAtZero:true}}}})}
</script></body></html>
